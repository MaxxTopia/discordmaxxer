name: Vencord SHC auto-rebump

# Watches Vencord bug #4256 — "[ShowHiddenChannels] Hidden channels no longer
# show names and permission overrides" — the open upstream break that currently
# stops locked-channel names from rendering. We're already pinned to the latest
# Vencord main, but main itself still has the bug, so there's nothing to bump TO
# yet. The moment Vencord CLOSES #4256 (i.e. ships a fix), this:
#   1. re-pins our Vencord to current main,
#   2. VERIFIES the rebrand still applies with 0 warnings AND the build passes,
#   3. ships a CANARY (prerelease, -beta.1) ONLY if that gate is green — so only
#      beta-opted (DMBeta) users auto-update to it, NOT everyone — and DMs Diggy
#      to test a voice call + promote to stable,
#   4. otherwise opens or reuses one issue, reports the exact failure state once,
#      and never publishes an unverified canary.
# So a broken OR unverified bump can never auto-reach the whole user base (audit
# 2026-06-26 H1). Diggy opted into auto-re-bump (2026-06-14). Disable anytime in
# the Actions tab. Manual run: workflow_dispatch.

on:
    schedule:
        - cron: "0 16 * * *" # daily 16:00 UTC — cheap check; heavy job only runs when the fix lands
    workflow_dispatch: {}

# A scheduled run and a manually dispatched run must not race each other into
# creating duplicate review issues or pushing two re-pins at once.
concurrency:
    group: vencord-shc-autobump
    cancel-in-progress: false

permissions:
    contents: write
    issues: write

env:
    VENCORD_ISSUE: "4256"

jobs:
    gate:
        runs-on: ubuntu-latest
        outputs:
            go: ${{ steps.c.outputs.go }}
            sha: ${{ steps.c.outputs.sha }}
            version: ${{ steps.c.outputs.version }}
        steps:
            - uses: actions/checkout@v6
            - id: c
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  set -e
                  STATE=$(gh api "repos/Vendicated/Vencord/issues/${VENCORD_ISSUE}" -q .state 2>/dev/null || echo "open")
                  UP=$(gh api repos/Vendicated/Vencord/commits/main -q .sha 2>/dev/null || echo "")
                  OUR=$(grep -oE 'vencord-src checkout [0-9a-f]{40}' .github/workflows/release.yml | grep -oE '[0-9a-f]{40}' | head -1)
                  echo "issue #${VENCORD_ISSUE} state=$STATE  our=$OUR  up=$UP"
                  if [ "$STATE" = "closed" ] && [ -n "$UP" ] && [ "$UP" != "$OUR" ]; then
                      VER=$(node -p "const v=require('./package.json').version.split('.'); v[2]=(+v[2]+1); v.join('.')")
                      echo "go=true"        >> "$GITHUB_OUTPUT"
                      echo "sha=$UP"        >> "$GITHUB_OUTPUT"
                      echo "version=$VER"   >> "$GITHUB_OUTPUT"
                      echo "→ #${VENCORD_ISSUE} is fixed; will re-bump to $UP as v$VER"
                  else
                      echo "go=false" >> "$GITHUB_OUTPUT"
                      echo "→ not fixed yet (or already current); nothing to do"
                  fi

    rebump:
        needs: gate
        if: needs.gate.outputs.go == 'true'
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6 # Use the root packageManager for the app

            # Vencord's current packageManager requires Node 22. Node 20 let
            # this workflow reach the nested install, where Corepack tried to
            # invoke Vencord's pnpm through a broken runner path and the job
            # failed before the rebrand gate could run.
            - name: Use Node.js 22
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: "pnpm"

            - name: Re-pin Vencord + bump version
              shell: bash
              run: |
                  set -e
                  SHA="${{ needs.gate.outputs.sha }}"
                  VER="${{ needs.gate.outputs.version }}"
                  sed -i -E "s/vencord-src checkout [0-9a-f]{40}/vencord-src checkout ${SHA}/" .github/workflows/release.yml
                  VENCORD_SHA="${SHA}" node -e 'const fs=require("fs");const f="overlay-scripts/vencord-source.json";const p=JSON.parse(fs.readFileSync(f,"utf8"));p.commit=process.env.VENCORD_SHA;fs.writeFileSync(f,JSON.stringify(p,null,4)+"\n")'
                  # CANARY: build a PRERELEASE version so electron-builder marks
                  # the GitHub release as a prerelease — only DMBeta (allowPrerelease)
                  # users auto-update to it. The base version stays clean on main;
                  # Diggy promotes to stable by tagging vX.Y.Z after a voice test.
                  node -e "const f='package.json';const p=require('./'+f);p.version='${VER}-beta.1';require('fs').writeFileSync(f, JSON.stringify(p,null,4)+'\n')"
                  echo "Re-pinned Vencord → ${SHA}; CANARY version → ${VER}-beta.1 (prerelease)"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Clone Vencord at new commit
              shell: bash
              run: |
                  git clone https://github.com/Vendicated/Vencord.git vencord-src
                  git -C vencord-src checkout "${{ needs.gate.outputs.sha }}"

            - name: Install Vencord deps
              working-directory: vencord-src
              # Resolve Vencord's own packageManager field instead of forcing
              # the root project's pnpm binary onto its lockfile.
              run: |
                  corepack enable
                  pnpm --version
                  pnpm install --frozen-lockfile

            - name: Sync pinned Vencord metadata
              shell: bash
              run: |
                  set -euo pipefail
                  VENCORD_SHA="${{ needs.gate.outputs.sha }}" node -e 'const fs=require("fs");const cp=require("child_process");const f="overlay-scripts/vencord-source.json";const p=JSON.parse(fs.readFileSync(f,"utf8"));const actual=cp.execFileSync("git",["-C","vencord-src","rev-parse","HEAD"],{encoding:"utf8"}).trim();if(actual!==process.env.VENCORD_SHA)throw new Error(`Vencord checkout ${actual} does not match requested ${process.env.VENCORD_SHA}`);const upstream=JSON.parse(fs.readFileSync("vencord-src/package.json","utf8"));if(typeof upstream.version!=="string"||!upstream.version)throw new Error("Vencord package.json has no version");p.commit=actual;p.packageVersion=upstream.version;fs.writeFileSync(f,JSON.stringify(p,null,4)+"\n")'
                  echo "Pinned Vencord metadata to ${{ needs.gate.outputs.sha }} / $(node -p "require('./overlay-scripts/vencord-source.json').packageVersion")"

            - name: Apply rebrand + build overlay — GATE on 0 rebrand warnings
              shell: bash
              env:
                  DM_STRICT_REBRAND: "1"
              run: |
                  set -o pipefail
                  pnpm overlay:vencord 2>&1 | tee overlay.log
                  WARN=$(grep -oE 'warnings=[0-9]+' overlay.log | grep -oE '[0-9]+' | tail -1 || echo "99")
                  echo "rebrand warnings = $WARN"
                  if [ "$WARN" != "0" ]; then
                      echo "::error::Rebrand produced $WARN warning(s) on the new Vencord — a patch needs updating. Aborting auto-ship."
                      exit 1
                  fi

            - name: Build
              run: pnpm build

            # Integrity gate before publish (same as the primary release path).
            - name: Verify build artifacts
              run: node overlay-scripts/verify-build.mjs

            - name: Commit re-pin to main
              shell: bash
              run: |
                  set -euo pipefail
                  git diff --check
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  # Commit ONLY the Vencord pin and its provenance metadata (the
                  # durable fix). Do NOT commit the -beta.1 version — main keeps
                  # its clean base version so stable promotion is a normal tag.
                  git add .github/workflows/release.yml overlay-scripts/vencord-source.json
                  git commit -m "chore: re-pin Vencord (ShowHiddenChannels fix #${VENCORD_ISSUE} landed); canary v${{ needs.gate.outputs.version }}-beta.1 shipped for verification"
                  git push origin HEAD:main
                  echo "REBUMP_PUSHED=true" >> "$GITHUB_ENV"

            - name: Publish CANARY (prerelease) release
              run: pnpm electron-builder --windows --publish always
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Record canary publication
              if: success()
              shell: bash
              run: echo "CANARY_PUBLISHED=true" >> "$GITHUB_ENV"

            - name: DM Diggy — canary shipped, needs verify + promote
              if: success()
              shell: bash
              env:
                  MAXX_BOT_TOKEN: ${{ secrets.MAXX_BOT_TOKEN }}
              run: |
                  bash scripts/notify-maxx.sh "[Discordmaxxer] auto-rebump shipped CANARY prerelease v${{ needs.gate.outputs.version }}-beta.1 (Vencord #${VENCORD_ISSUE} fix). Only beta-opted users get it. TEST a voice call, then promote to stable: bump package.json to ${{ needs.gate.outputs.version }}, tag v${{ needs.gate.outputs.version }}, push."

            # Keep one open review issue per incident and make the alert match
            # what actually reached main or GitHub before the failure.
            - name: On failure — record manual review and alert once
              if: failure()
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  MAXX_BOT_TOKEN: ${{ secrets.MAXX_BOT_TOKEN }}
              run: |
                  set -u
                  TITLE="[auto-rebump] Vencord re-bump needs manual review"
                  RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

                  if [ "${CANARY_PUBLISHED:-false}" = "true" ]; then
                    OUTCOME="A canary release was published, but a later verification or notification step failed."
                  elif [ "${REBUMP_PUSHED:-false}" = "true" ]; then
                    OUTCOME="The Vencord re-pin was pushed to main, but the canary release did not finish."
                  else
                    OUTCOME="The rebrand, integrity check, or build failed before the re-pin was pushed; no canary was published."
                  fi

                  EXISTING=$(gh issue list -R "${{ github.repository }}" --state open \
                      --search "in:title \"${TITLE}\"" --json number -q '.[0].number' 2>/dev/null || true)
                  if [ -n "${EXISTING:-}" ]; then
                    ISSUE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/${EXISTING}"
                    echo "Open manual-review issue #${EXISTING} already exists; suppressing duplicate issue and DM."
                    exit 0
                  fi

                  BODY=$(cat <<EOF
                  Vencord #${VENCORD_ISSUE} closed, so the auto-rebump tried to move our pin to main \`${{ needs.gate.outputs.sha }}\` (canary v${{ needs.gate.outputs.version }}-beta.1).

                  ${OUTCOME}

                  A rebrand patch may need updating against the new Vencord. Do it manually: check out that SHA in vencord-src, run \`pnpm overlay:vencord\`, fix any warning find-strings, then release. See TROUBLESHOOTING.md.

                  Failed run: ${RUN_URL}
                  EOF
                  )
                  ISSUE_URL=$(gh issue create -R "${{ github.repository }}" \
                      --title "$TITLE" --body "$BODY" 2>/dev/null || true)
                  if [ -n "${ISSUE_URL:-}" ]; then
                    bash scripts/notify-maxx.sh "[Discordmaxxer] auto-rebump failed. ${OUTCOME} Review: ${ISSUE_URL} Run: ${RUN_URL}"
                  else
                    bash scripts/notify-maxx.sh "[Discordmaxxer] auto-rebump failed and the manual-review issue could not be created. ${OUTCOME} Run: ${RUN_URL}"
                  fi
