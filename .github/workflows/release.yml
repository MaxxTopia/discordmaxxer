name: Release

# v0.1 = Windows-only per CLAUDE.md ("Mac/Linux defer to v0.2"). The previous
# matrix entries for macos-latest + ubuntu-latest are preserved in git history
# (revert this commit to restore them) and should come back when v0.2 ships.

on:
    push:
        tags:
            - v*
    workflow_dispatch:

# electron-builder --publish creates a GitHub release and uploads the
# installer + latest.yml; the default GITHUB_TOKEN only has contents=read
# on modern repos, so request contents=write explicitly here.
permissions:
    contents: write

jobs:
    release:
        runs-on: windows-latest
        # Beta tags MUST be valid semver (v0.7.58-beta.1), because electron-updater
        # parses every release tag it sees. A non-semver tag (e.g. `beta-v0.7.53`,
        # which is what we used to dodge this workflow) makes the update check throw
        # "invalid version" for anyone with the beta opt-in enabled — the check dies
        # silently and they never get prompted again. That cost a full day (2026-07-09).
        #
        # So: use real prerelease semver tags, and skip the stable publish for them.
        # A tag containing "-" is a prerelease and must never publish to the stable
        # channel. Non-tag runs (workflow_dispatch) are unaffected.
        if: ${{ !startsWith(github.ref, 'refs/tags/') || !contains(github.ref_name, '-') }}

        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6 # Install pnpm using packageManager key in package.json

            # Node 22, not 20: the pinned Vencord's packageManager is pnpm 11,
            # which requires Node >= 22.13 (it imports `node:sqlite`). On Node 20
            # the "Install Vencord deps" step dies with ERR_UNKNOWN_BUILTIN_MODULE.
            - name: Use Node.js 22
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: "pnpm"

            # Validate the human-readable notes before installing large build
            # dependencies or allowing Electron Builder to create a public
            # release. A post-publish notes failure must not turn into a
            # misleading "nothing published" alert.
            - name: Validate readable release notes
              shell: pwsh
              run: |
                  $tag = $env:GITHUB_REF_NAME
                  $version = $tag.TrimStart('v')
                  $notes = "docs/releases/v$version.md"
                  if (-not (Test-Path -LiteralPath $notes)) {
                    throw "Missing release notes file: $notes"
                  }
                  $body = Get-Content -LiteralPath $notes -Raw
                  if ([string]::IsNullOrWhiteSpace($body)) {
                    throw "Release notes file is empty: $notes"
                  }
                  if ($body -notmatch '(?m)^## Highlights\s*$') {
                    throw "Release notes must include a Highlights section: $notes"
                  }

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Discordmaxxer ships a forked Vencord with 61 rebrand patches +
            # 11 custom plugins side-loaded into vencord-src/src/userplugins/.
            # The build pipeline (pnpm overlay:vencord) needs vencord-src to
            # exist on disk; it's gitignored and not in our repo, so clone it
            # here at the pinned commit. Vencord moved to a rolling "devbuild":
            # its semver tags (latest v1.14.13) lag months behind main, where
            # plugin patches are kept current against Discord's client. Pinning
            # the old tag is why ShowHiddenChannels / FakeNitro / etc. broke
            # ("Patch had no effect"). So we pin a main COMMIT, not a tag. To
            # bump: set this SHA + check out the same in your local vencord-src,
            # re-run `pnpm overlay:vencord`, and verify the rebrand applies
            # cleanly. upstream-watch.yml flags when main moves ahead of this pin.
            - name: Clone Vencord at pinned commit
              run: |
                  git clone https://github.com/Vendicated/Vencord.git vencord-src
                  git -C vencord-src checkout ef29bbeb6119cfb53d1273ed78147bcc97d91261

            - name: Install Vencord deps
              working-directory: vencord-src
              # Vencord pins its OWN (newer) pnpm via its packageManager field.
              # Enable corepack so `pnpm` here resolves to Vencord's pnpm —
              # otherwise our older root pnpm rejects Vencord's lockfile format.
              run: |
                  corepack enable
                  pnpm install --frozen-lockfile

            # Applies overlay-scripts/rebrand-vencord.mjs (61 patches), syncs
            # plugins/* into vencord-src/src/userplugins/, builds Vencord, and
            # stages the 4 dist files at vencord-dist/ — which package.json's
            # extraResources[] copies into the packaged app at resources/
            # vencord-dist/.  Without this step the app falls back to
            # downloading stock unpatched Vencord at runtime — which is what
            # broke v0.1.0-rc1.
            # DM_STRICT_REBRAND=1 makes rebrand-vencord.mjs FAIL (not just warn)
            # if any rebrand patch went stale — so a release can't silently ship
            # with un-rebranded "Vencord" surfaces or broken plugin patches.
            - name: Apply rebrand + build Vencord overlay
              run: pnpm overlay:vencord
              env:
                  DM_STRICT_REBRAND: "1"

            - name: Build
              run: pnpm build

            # Integrity gate (audit 2026-06-26): refuse to publish a hollow build
            # — confirms the overlaid Vencord dist exists, our custom plugins
            # actually compiled in, and the shell bundle built. Catches a silent
            # overlay/build failure before it reaches users.
            - name: Verify build artifacts
              run: node overlay-scripts/verify-build.mjs

            # winaudio.node is shipped as a committed N-API prebuilt
            # (packages/winaudio/prebuilds/winaudio-x64.node) — same pattern as
            # libvesktop. We do NOT compile it here: node-gyp can't parse the
            # runner's VS 18 install, and N-API binaries are ABI-stable so the
            # prebuilt loads in Electron without a per-runtime rebuild.

            - name: Run Electron Builder
              run: pnpm electron-builder --windows --publish always
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # electron-builder creates the GitHub Release and uploads the
            # artifacts, but it does not consume docs/releases/*.md. Attach
            # the already-validated curated notes explicitly so the in-app
            # updater never falls back to "This release did not include
            # readable release notes". If GitHub rejects this post-publish
            # edit, the failure alert checks the release before describing it.
            - name: Attach readable release notes
              shell: pwsh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  $tag = $env:GITHUB_REF_NAME
                  $version = $tag.TrimStart('v')
                  $notes = "docs/releases/v$version.md"
                  gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file $notes

            # ── Cross-repo: notify maxxtopia.com so the Download CTA on the
            # site picks up the new version. The listener workflow on the
            # other side rewrites src/data/discordmaxxer-release.json,
            # commits, and Cloudflare Pages auto-deploys the rebuild.
            #
            # Requires repo secret `MAXXTOPIA_DISPATCH_PAT` — a fine-grained
            # PAT with `Contents: Read and write` + `Metadata: Read` on the
            # `MaxxTopia/maxxtopia` repo (the default GITHUB_TOKEN is scoped
            # to this repo only and can't trigger workflows in another).
            #
            # If the secret is missing, the step skips gracefully so the
            # release itself still ships (the site just stays on whatever
            # version it had).
            - name: Notify maxxtopia of new release
              if: success() && startsWith(github.ref, 'refs/tags/v') && env.HAS_PAT == 'true'
              shell: bash
              env:
                  PAT: ${{ secrets.MAXXTOPIA_DISPATCH_PAT }}
                  HAS_PAT: ${{ secrets.MAXXTOPIA_DISPATCH_PAT != '' }}
              run: |
                  TAG="${GITHUB_REF_NAME}"
                  VERSION="${TAG#v}"
                  curl --fail-with-body -X POST \
                       -H "Accept: application/vnd.github+json" \
                       -H "Authorization: Bearer ${PAT}" \
                       -H "X-GitHub-Api-Version: 2022-11-28" \
                       https://api.github.com/repos/MaxxTopia/maxxtopia/dispatches \
                       -d "$(jq -n \
                           --arg version "${TAG}" \
                           --arg installerUrl "https://github.com/MaxxTopia/discordmaxxer/releases/download/${TAG}/Discordmaxxer-Setup-${VERSION}.exe" \
                           --arg releasePageUrl "https://github.com/MaxxTopia/discordmaxxer/releases/tag/${TAG}" \
                           '{event_type: "discordmaxxer-released", client_payload: {version: $version, installerUrl: $installerUrl, releasePageUrl: $releasePageUrl}}')"

    # Maxx-bot alert (audit 2026-06-26): if a release run fails for ANY reason
    # (stale-rebrand gate, integrity gate, build, publish, or a post-publish
    # edit), DM Diggy so the problem is never silent. The alert checks the
    # GitHub Release first so it never claims "nothing published" when a later
    # step failed after the artifacts were already uploaded.
    notify-failure:
        needs: release
        if: failure()
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: DM Diggy via Maxx bot
              shell: bash
              env:
                  MAXX_BOT_TOKEN: ${{ secrets.MAXX_BOT_TOKEN }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -u
                  RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                  RELEASE_JSON=""
                  for attempt in 1 2 3; do
                    if RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>/dev/null)"; then
                      break
                    fi
                    RELEASE_JSON=""
                    sleep 5
                  done

                  if [ -n "$RELEASE_JSON" ]; then
                    DRAFT="$(printf '%s' "$RELEASE_JSON" | jq -r '.draft // true')"
                    ASSET_COUNT="$(printf '%s' "$RELEASE_JSON" | jq -r '.assets | length')"
                    RELEASE_URL="$(printf '%s' "$RELEASE_JSON" | jq -r '.html_url // empty')"
                    if [ "$DRAFT" = "false" ] && [ "$ASSET_COUNT" -gt 0 ]; then
                      MESSAGE="[Discordmaxxer] RELEASE RUN FAILED after publishing ${GITHUB_REF_NAME}. The GitHub Release is live with ${ASSET_COUNT} asset(s); a later post-publish step failed. Release: ${RELEASE_URL} Run: ${RUN_URL}"
                    else
                      MESSAGE="[Discordmaxxer] RELEASE PARTIAL for ${GITHUB_REF_NAME}. A GitHub Release record exists, but it is still draft or has no uploaded assets. Check the release and run: ${RELEASE_URL} ${RUN_URL}"
                    fi
                  else
                    MESSAGE="[Discordmaxxer] RELEASE FAILED for ${GITHUB_REF_NAME}. No GitHub Release was found after the failed run, so nothing is available to download. Check the run: ${RUN_URL}"
                  fi

                  bash scripts/notify-maxx.sh "$MESSAGE"
