name: Upstream watch

# Safeguard against silently falling behind Discord. The build breaking on a
# Discord server-side change (e.g. mandatory DAVE E2EE + zstd assets that an old
# Electron can't decode) traces back to the bundled Electron / Vencord drifting
# behind upstream. This job checks weekly whether upstream Vesktop's Electron pin
# or the latest Vencord release has moved ahead of ours and, if so, opens a
# single tracking issue so it gets noticed without anyone watching. Fully
# autonomous — no maintainer action needed to detect drift.

on:
    schedule:
        - cron: "0 14 * * 1" # Mondays 14:00 UTC
    workflow_dispatch: {}

permissions:
    contents: read
    issues: write

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Compare against upstream
              id: cmp
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  norm() { sed -E 's/^[^0-9]*//; s/[^0-9.].*$//'; }

                  # Our Electron pin
                  OUR_ELECTRON=$(node -p "require('./package.json').devDependencies.electron" | norm)

                  # Upstream Vesktop's Electron pin (main)
                  UP_ELECTRON=$(curl -fsSL https://raw.githubusercontent.com/Vencord/Vesktop/main/package.json \
                      | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write((JSON.parse(s).devDependencies.electron||''))}catch{process.stdout.write('')}})" \
                      | norm)

                  # Our Vencord pin = the commit SHA release.yml checks out.
                  OUR_VENCORD=$(grep -oE 'vencord-src checkout [0-9a-f]{7,40}' .github/workflows/release.yml | grep -oE '[0-9a-f]{7,40}' | head -1 || echo "unknown")
                  # Vencord ships a rolling devbuild (main); its semver tags lag
                  # months behind main, where plugin patches are kept current vs
                  # Discord — so we track main commit-AGE drift, not tags.
                  UP_VENCORD=$(gh api repos/Vendicated/Vencord/commits/main -q '.sha' 2>/dev/null | cut -c1-12 || echo "unknown")
                  VENCORD_DRIFT_DAYS=0
                  if [ "$OUR_VENCORD" != "unknown" ] && [ "$UP_VENCORD" != "unknown" ]; then
                      OUR_DATE=$(gh api "repos/Vendicated/Vencord/commits/$OUR_VENCORD" -q '.commit.committer.date' 2>/dev/null || echo "")
                      UP_DATE=$(gh api repos/Vendicated/Vencord/commits/main -q '.commit.committer.date' 2>/dev/null || echo "")
                      if [ -n "$OUR_DATE" ] && [ -n "$UP_DATE" ]; then
                          VENCORD_DRIFT_DAYS=$(( ( $(date -d "$UP_DATE" +%s) - $(date -d "$OUR_DATE" +%s) ) / 86400 ))
                      fi
                  fi

                  echo "our_electron=$OUR_ELECTRON"   >> "$GITHUB_OUTPUT"
                  echo "up_electron=$UP_ELECTRON"     >> "$GITHUB_OUTPUT"
                  echo "our_vencord=$OUR_VENCORD"     >> "$GITHUB_OUTPUT"
                  echo "up_vencord=$UP_VENCORD"       >> "$GITHUB_OUTPUT"

                  BEHIND=""
                  if [ -n "$UP_ELECTRON" ] && [ "$OUR_ELECTRON" != "$UP_ELECTRON" ]; then
                      # only flag if upstream is strictly newer
                      NEWER=$(printf '%s\n%s\n' "$OUR_ELECTRON" "$UP_ELECTRON" | sort -V | tail -1)
                      if [ "$NEWER" = "$UP_ELECTRON" ]; then
                          BEHIND="${BEHIND}- Electron: ours \`$OUR_ELECTRON\` → upstream Vesktop \`$UP_ELECTRON\`\n"
                      fi
                  fi
                  # Flag Vencord only when our pin is meaningfully stale (>30d behind
                  # main) — main moves daily, so this avoids weekly noise while still
                  # catching the drift that breaks plugin patches (ShowHiddenChannels etc.).
                  if [ "${VENCORD_DRIFT_DAYS:-0}" -gt 30 ]; then
                      BEHIND="${BEHIND}- Vencord: pin \`$OUR_VENCORD\` is ${VENCORD_DRIFT_DAYS}d behind main (\`$UP_VENCORD\`) — stale plugin patches likely\n"
                  fi

                  if [ -n "$BEHIND" ]; then
                      { echo "behind=true"; echo "summary<<EOF"; printf '%b' "$BEHIND"; echo "EOF"; } >> "$GITHUB_OUTPUT"
                  else
                      echo "behind=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Open tracking issue if behind
              if: steps.cmp.outputs.behind == 'true'
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
                  SUMMARY: ${{ steps.cmp.outputs.summary }}
              run: |
                  set -euo pipefail
                  TITLE="[upstream] Dependencies behind upstream — review for voice/compat fixes"

                  # Idempotent: don't pile up duplicates while one is open.
                  EXISTING=$(gh issue list -R "$REPO" --state open --search "in:title \"[upstream] Dependencies behind upstream\"" --json number -q '.[0].number' 2>/dev/null || true)
                  if [ -n "${EXISTING:-}" ]; then
                      echo "Open tracking issue #$EXISTING already exists; skipping."
                      exit 0
                  fi

                  BODY=$(cat <<EOF
                  Automated check: Discordmaxxer's bundled dependencies have fallen behind upstream.

                  $SUMMARY

                  **Why this matters:** falling behind Electron/Vencord is what lets Discord
                  server-side changes silently break the app (e.g. the DAVE E2EE + zstd voice
                  outage). Review whether an update is needed.

                  **Before bumping Electron, read \`TROUBLESHOOTING.md\` → "stay current".**
                  After any bump: \`pnpm install && pnpm overlay:vencord && pnpm build\`, then
                  **test a real voice call** before releasing.

                  _Opened automatically by .github/workflows/upstream-watch.yml. Close when handled._
                  EOF
                  )

                  gh issue create -R "$REPO" --title "$TITLE" --body "$BODY" || \
                      echo "Could not create issue (check Settings → Actions → Workflow permissions = read/write, and that Issues are enabled)."

            # Push the same drift alert to Diggy via the Maxx bot so it's noticed
            # without watching the Issues tab. No-op if MAXX_BOT_TOKEN isn't set.
            - name: DM Diggy via Maxx bot
              if: steps.cmp.outputs.behind == 'true'
              shell: bash
              env:
                  MAXX_BOT_TOKEN: ${{ secrets.MAXX_BOT_TOKEN }}
                  SUMMARY: ${{ steps.cmp.outputs.summary }}
              run: |
                  bash scripts/notify-maxx.sh "[Discordmaxxer] upstream drift detected -- a dependency is behind upstream (voice/compat risk). Review the tracking issue: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues"
